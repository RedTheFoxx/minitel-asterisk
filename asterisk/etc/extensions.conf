[general]
static=yes
writeprotect=no
clearglobalvars=no

[globals]
MODEM_ADDR=127.0.0.1:4040

; ------------------------------------------------------------------
; Minitel server: answer and hand the raw audio to the V.23 soft-modem
; container through AudioSocket (8 kHz signed-linear, no processing).
; ------------------------------------------------------------------
[minitel-server]
exten => s,1,NoOp(Appel Minitel de ${CALLERID(num)})
 same => n,Answer()
 same => n,Set(TIMEOUT(absolute)=3600)
 same => n,Set(UID=${SHELL(cat /proc/sys/kernel/random/uuid | tr -d '\n')})
 same => n,AudioSocket(${UID},${MODEM_ADDR})
 same => n,Hangup()

; Minitel dials anything: the modem server answers. Hotline-style.
[from-minitel]
exten => 100,1,Dial(PJSIP/pc,40)
 same => n,Hangup()
; 0 + number -> outbound through the OVH line
exten => _0X.,1,Dial(PJSIP/${EXTEN}@ovh,60)
 same => n,Hangup()
exten => _X.,1,Goto(minitel-server,s,1)
exten => s,1,Goto(minitel-server,s,1)
exten => i,1,Goto(minitel-server,s,1)

; Softphone on the PC
[from-pc]
exten => 101,1,Dial(PJSIP/minitel,60)          ; ring the Minitel line
 same => n,Hangup()
exten => _3[0-9]XX,1,Goto(minitel-server,s,1)  ; 3615 etc: modem server
exten => _0X.,1,Dial(PJSIP/${EXTEN}@ovh,60)    ; outbound via OVH (e.g. 0972101721)
 same => n,Hangup()
exten => 600,1,Answer()                        ; echo test
 same => n,Echo()
 same => n,Hangup()

; Incoming calls from the OVH number
[from-ovh]
exten => _X.,1,Goto(minitel-server,s,1)
exten => s,1,Goto(minitel-server,s,1)
