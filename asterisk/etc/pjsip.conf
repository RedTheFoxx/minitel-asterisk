; Transport, PC softphone and OVH trunk are generated by entrypoint.sh
#include generated/pjsip_transport.conf
#include generated/pjsip_pc.conf
#include generated/pjsip_ovh.conf

; ---- HT802v2 bridge (Minitel). Static contact: Asterisk can call it, and it
; ---- can call us, whether or not it registers.
[minitel]
type=endpoint
transport=transport-udp
context=from-minitel
disallow=all
allow=alaw
allow=ulaw
aors=minitel
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
dtmf_mode=rfc4733
t38_udptl=no
callerid="Minitel" <101>

[minitel]
type=aor
max_contacts=1
remove_existing=yes
qualify_frequency=30

[minitel]
type=identify
endpoint=minitel
match=192.168.1.56
